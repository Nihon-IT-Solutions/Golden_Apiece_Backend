[project]
name = "golden-apiece-mlm-backend"
version = "2.0.0"
description = "Golden Apiece MLM - FastAPI backend (Supabase Postgres)"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "sqlalchemy==2.0.36",
  "pydantic==2.10.4",
  "pydantic-settings==2.7.0",
  "psycopg[binary]==3.2.3",
  "pyjwt==2.10.1",
  "bcrypt==4.2.1",
  "email-validator==2.2.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

